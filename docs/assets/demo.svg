  <text x="22" y="461" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" xml:space="preserve">  3. [KRİTİK] [TERM_EKSIK] Sözlük karşılığı eksik: “kargo ücreti” → “shipping fee”</text>
