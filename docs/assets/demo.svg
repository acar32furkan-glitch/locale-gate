  <text x="22" y="271" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" xml:space="preserve">  1. [KRİTİK] [TERM_EKSIK] Sözlük karşılığı eksik: “şişme mont” → “puffer jacket”</text>
