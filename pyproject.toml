[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locale-gate"
version = "0.1.0"
description = "Deterministic translation quality gate for TR↔EN e-commerce content (terminology, placeholders, Turkish diacritics, length budgets)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "acar32furkan-glitch" }]
keywords = ["localization", "translation", "qa", "turkish", "e-commerce", "cli", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pydantic>=2.8", "pyyaml>=6.0"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[project.scripts]
locale-gate = "locale_gate.cli:main"

[project.urls]
Homepage = "https://github.com/acar32furkan-glitch/locale-gate"
Issues = "https://github.com/acar32furkan-glitch/locale-gate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/locale_gate"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["golden: golden set regression cases"]

[tool.coverage.run]
branch = true
source = ["locale_gate"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "EM", "ISC", "ICN", "LOG", "G", "PIE", "PT", "Q", "RUF", "RET", "SIM", "TID", "ARG", "PTH", "PL", "TRY", "S", "BLE", "FBT", "ANN", "D"]
ignore = [
  "D203", "D213", "D407", "D406", "D413", "D416", "D105", "D107",
  "TRY003", "TRY300", "TRY004", "EM101", "EM102",
  "PLR0913", "PLR0912", "PLR0915", "PLR0911", "PLR2004",
  "ANN401", "S603", "S607", "S105", "S106", "FBT001", "FBT002", "RUF012", "SIM102",
  # Proje Türkçe metinlerle çalışır: diakritikler ve "×/%" gibi işaretler kasıtlıdır.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN201", "ANN001", "D103", "D100", "D104", "ARG001"]
"scripts/*" = ["T201", "D103", "ANN201", "PLR2004"]
"src/locale_gate/cli.py" = ["T201", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
