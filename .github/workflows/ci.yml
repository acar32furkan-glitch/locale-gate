name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: kalite (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Matris yorumlayıcısını uv'ye sabitliyoruz: aksi hâlde `uv run` .python-version'a dönüp
    # venv'i yeniden kurar (ve dev araçları düşer). Bu satır olmadan 3.13 işi sessizce 3.12 koşar.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Bağımlılıkları kur
        run: uv sync --all-extras --dev
      - name: Yorumlayıcıyı ve araçları doğrula
        run: |
          uv run python -c "import sys; v=f'{sys.version_info[0]}.{sys.version_info[1]}'; assert v == '${{ matrix.python-version }}', f'beklenen ${{ matrix.python-version }}, gelen {v}'; print('python', v)"
          uv run ruff --version
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest + kapsam
        run: uv run pytest --cov=locale_gate --cov-report=term-missing --cov-fail-under=85
      - name: Altın set (kuralların davranış sözleşmesi)
        run: uv run locale-gate eval examples/golden

  gate:
    name: kapı örnek katalogda çalışıyor mu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev

      - name: Kusurlu katalog kapıyı düşürmeli (çıkış kodu 1 beklenir)
        run: |
          set +e
          uv run locale-gate check examples/data/catalog.json \
            --glossary examples/data/glossary.yaml --max-findings 5 > /dev/null
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "HATA: beklenen çıkış kodu 1, gelen $code" >&2
            exit 1
          fi
          echo "doğru davranış: kapı düştü (exit 1)"

      - name: Düzeltilmiş katalog kapıyı geçmeli (çıkış kodu 0 beklenir)
        run: |
          uv run locale-gate check examples/data/catalog-fixed.json \
            --glossary examples/data/glossary.yaml --max-findings 5

      - name: İş özeti (Actions sekmesine Markdown rapor)
        if: always()
        run: |
          set +e
          uv run locale-gate check examples/data/catalog.json \
            --glossary examples/data/glossary.yaml --github-summary > /dev/null
          exit 0
